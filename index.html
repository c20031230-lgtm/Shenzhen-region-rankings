<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>深圳地区月度榜单排名</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Inter:wght@400;600;800&display=swap');
        
        body {
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
            background-color: #f1f5f9;
            background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
            background-size: 20px 20px;
            color: #0f172a;
        }

        /* 固定列宽 - 确保排名列宽足够，防止文字竖排 */
        .col-rank { width: 100px; min-width: 100px; }
        .col-name { width: 200px; }
        .col-total { width: 160px; }
        .col-target { width: 100px; }
        .col-progress { width: auto; }
        .col-action { width: 180px; text-align: right; }

        .rank-table {
            table-layout: fixed;
            width: 100%;
        }

        .rank-table tbody tr:hover {
            background-color: rgba(241, 245, 249, 0.9);
        }

        .star-animate {
            animation: starPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes starPop {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .trophy-float {
            animation: floating 2s ease-in-out infinite;
            display: inline-block;
            vertical-align: middle;
        }

        @keyframes floating {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-1.5px); }
        }

        .trophy-gold { color: #fbbf24; filter: drop-shadow(0 0 2px rgba(251, 191, 36, 0.3)); }
        .trophy-silver { color: #94a3b8; filter: drop-shadow(0 0 2px rgba(148, 163, 184, 0.3)); }
        .trophy-bronze { color: #d97706; filter: drop-shadow(0 0 2px rgba(217, 119, 6, 0.3)); }

        .nav-tab {
            position: relative;
            cursor: pointer;
            padding: 1.25rem 0;
            margin-right: 2.5rem;
            color: #94a3b8;
            font-weight: 600;
            font-size: 0.875rem;
            transition: all 0.3s;
        }
        .nav-tab.active { color: var(--theme-color-hex, #2563eb); }
        .nav-tab.active::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; width: 100%; height: 3px;
            background: var(--theme-color-hex, #2563eb);
            border-radius: 3px 3px 0 0;
        }

        .badge-1 { background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%); color: white; }
        .badge-2 { background: linear-gradient(135deg, #94a3b8 0%, #475569 100%); color: white; }
        .badge-3 { background: linear-gradient(135deg, #d97706 0%, #92400e 100%); color: white; }

        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

        /* --- 弹窗与确认界面专属动效 --- */
        .modal-overlay {
            backdrop-filter: blur(12px);
            transition: all 0.4s ease;
        }
        
        .modal-container {
            animation: modalScaleUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 40px 80px -15px rgba(0, 0, 0, 0.25);
        }

        @keyframes modalScaleUp {
            from { opacity: 0; transform: scale(0.9) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .pulse-red {
            animation: pulseRed 2s infinite;
        }
        @keyframes pulseRed {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .btn-shine {
            position: relative;
            overflow: hidden;
        }
        .btn-shine::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.2), transparent);
            transform: rotate(45deg);
            transition: 0.6s;
        }
        .btn-shine:hover::after { left: 120%; }

        .glass-card {
            background: rgba(255, 255, 255, 0.98);
            border: 1px solid rgba(255, 255, 255, 1);
        }
    </style>
</head>
<body class="min-h-screen antialiased">
    <!-- 优化后的使用须知弹窗 -->
    <div id="noticeModal" class="fixed inset-0 z-[1000] flex items-center justify-center p-6 modal-overlay bg-slate-900/40">
        <div class="glass-card rounded-[3rem] p-10 max-w-[500px] w-full modal-container relative overflow-hidden">
            <!-- 顶部装饰条 -->
            <div class="absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r from-blue-500 via-indigo-500 to-purple-500"></div>
            
            <div class="flex flex-col items-center text-center">
                <div class="w-16 h-16 bg-blue-50 rounded-2xl flex items-center justify-center mb-6 shadow-inner rotate-3">
                    <i data-lucide="shield-check" class="w-8 h-8 text-blue-600"></i>
                </div>
                <h3 class="text-3xl font-black text-slate-900 mb-2 tracking-tight">数据安全与存储提示</h3>
                <p class="text-slate-400 text-sm font-medium mb-8">为了保障您的使用体验，请务必了解以下须知：</p>
                
                <div class="w-full space-y-4 mb-10 text-left">
                    <div class="group flex gap-5 p-5 rounded-[2rem] bg-slate-50 border border-slate-100 transition-all hover:bg-white hover:shadow-xl hover:shadow-slate-200/50 hover:scale-[1.02]">
                        <div class="w-12 h-12 bg-white rounded-2xl shadow-sm flex items-center justify-center shrink-0 border border-slate-50">
                            <i data-lucide="hard-drive" class="w-6 h-6 text-blue-500"></i>
                        </div>
                        <div>
                            <p class="text-[14px] font-black text-slate-800 mb-1">浏览器本地存储</p>
                            <p class="text-[12px] text-slate-500 leading-relaxed font-medium">数据仅保存在您<span class="text-blue-600 font-bold">当前浏览器</span>中。更换设备或清除浏览器缓存会导致所有榜单数据重置且无法找回。</p>
                        </div>
                    </div>
                    
                    <div class="group flex gap-5 p-5 rounded-[2rem] bg-red-50/30 border border-red-50 transition-all hover:bg-white hover:shadow-xl hover:shadow-red-200/30 hover:scale-[1.02]">
                        <div class="w-12 h-12 bg-white rounded-2xl shadow-sm flex items-center justify-center shrink-0 border border-red-50">
                            <i data-lucide="ghost" class="w-6 h-6 text-red-500"></i>
                        </div>
                        <div>
                            <p class="text-[14px] font-black text-red-600 mb-1">无痕/私密模式限制</p>
                            <p class="text-[12px] text-slate-500 leading-relaxed font-medium">在无痕模式下，数据<span class="text-red-500 font-bold">无法被共享或持久保存</span>。关闭窗口后，所有录入的数据将立即消失。</p>
                        </div>
                    </div>
                </div>

                <button onclick="closeNotice()" class="btn-shine w-full py-5 rounded-[1.8rem] bg-slate-900 text-white font-black text-[16px] tracking-widest hover:scale-[1.02] active:scale-95 transition-all duration-300 flex items-center justify-center gap-3 shadow-2xl shadow-slate-900/20">
                    我知道了，开始使用
                    <i data-lucide="chevron-right" class="w-5 h-5"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- 优化后的确认削减界面 -->
    <div id="confirmModal" class="fixed inset-0 z-[1001] hidden flex items-center justify-center p-6 modal-overlay bg-slate-950/80">
        <div class="glass-card rounded-[3rem] p-12 max-w-[420px] w-full modal-container border-t-4 border-red-500">
            <div class="flex flex-col items-center text-center">
                <!-- 呼吸灯警告图标 -->
                <div class="w-20 h-20 bg-red-100 rounded-full flex items-center justify-center mb-8 pulse-red">
                    <i data-lucide="alert-circle" class="w-10 h-10 text-red-600"></i>
                </div>
                
                <h3 class="text-2xl font-black text-slate-900 mb-4 tracking-tight">确认减少数值？</h3>
                
                <div id="confirmText" class="w-full bg-red-50/50 py-5 px-8 rounded-3xl border border-red-100/50 mb-10">
                    <!-- JS 填充内容 -->
                </div>

                <div class="flex flex-col w-full gap-4">
                    <button id="confirmActionBtn" class="btn-shine bg-gradient-to-r from-red-600 to-rose-700 w-full py-5 rounded-[1.5rem] text-white font-black text-[16px] tracking-wider shadow-xl shadow-red-200 transition-all active:scale-95">
                        确认扣减
                    </button>
                    <button onclick="closeConfirm()" class="w-full py-5 rounded-[1.5rem] bg-slate-100 text-slate-500 font-bold text-[15px] hover:bg-slate-200 transition-all active:scale-95">
                        暂不修改
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="app" class="p-4 md:p-8 lg:p-12">
        <!-- 顶部控制栏 -->
        <div class="max-w-7xl mx-auto flex flex-wrap items-center gap-4 mb-6 bg-white/90 p-4 rounded-3xl shadow-xl border border-white/60 backdrop-blur-md">
            <div class="flex items-center gap-2">
                <div class="flex bg-slate-100 p-1 rounded-xl">
                    <select id="tabSelect" onchange="selectTab(this.value)" class="bg-transparent border-none text-slate-700 py-2 pl-3 pr-8 rounded-lg font-bold focus:outline-none transition-all text-sm cursor-pointer hover:bg-white/50">
                        <option value="A1">A1 榜单</option>
                        <option value="NP">伊赫莱NP榜单</option>
                        <option value="HST">赫双妥榜单</option>
                        <option value="ZYF">早夜访榜单</option>
                    </select>
                </div>
                <div class="h-6 w-px bg-slate-200 mx-1"></div>
                <select id="monthSelect" onchange="updateMonth()" class="bg-white border border-slate-200 text-slate-600 py-2 pl-3 pr-8 rounded-xl font-semibold focus:ring-4 focus:ring-slate-100 transition-all text-sm min-w-[120px]">
                </select>
            </div>
            <div class="ml-auto flex items-center gap-3">
                <button onclick="copyToClipboard()" class="bg-slate-900 hover:bg-black text-white px-5 py-2.5 rounded-xl font-bold flex items-center gap-2 transition-all text-sm shadow-lg active:scale-95">
                    <i data-lucide="share-2" class="w-4 h-4"></i> 复制榜单
                </button>
                <button onclick="exportAllToExcel()" class="bg-white border border-slate-200 hover:border-green-300 hover:bg-green-50 text-slate-700 px-4 py-2.5 rounded-xl font-bold flex items-center gap-2 transition-all text-sm shadow-sm">
                    <i data-lucide="file-spreadsheet" class="w-4 h-4 text-green-600"></i> 导出全榜单
                </button>
            </div>
        </div>

        <!-- 标题区 -->
        <div class="max-w-7xl mx-auto mb-8 flex flex-col md:flex-row md:items-end justify-between gap-4 px-2">
            <div class="flex items-center gap-5">
                <div id="tabIndicator" class="w-3 h-12 rounded-full bg-blue-600 shadow-lg"></div>
                <div>
                    <h1 id="bigTabName" class="text-5xl font-black tracking-tighter text-slate-900 uppercase italic leading-none mb-2">A1 榜单</h1>
                    <p class="text-slate-400 font-bold text-xs tracking-widest uppercase flex items-center gap-2">
                        <i data-lucide="award" class="w-3 h-3 text-slate-400"></i> 
                        PERFORMANCE STAR BOARD
                    </p>
                </div>
            </div>
            <div class="flex flex-col items-end">
                <span id="currentMonthLabel" class="bg-white/80 border border-slate-200 px-4 py-1.5 rounded-2xl text-[14px] font-black text-slate-700 shadow-sm backdrop-blur-sm">---</span>
            </div>
        </div>

        <!-- 数据面板 -->
        <div class="max-w-7xl mx-auto bg-white rounded-[2rem] shadow-2xl border border-slate-200 overflow-hidden">
            <div class="flex items-center justify-between border-b border-slate-100 px-10 bg-white">
                <div class="flex">
                    <span id="nav-rank" onclick="switchView('rank')" class="nav-tab active">
                        <span class="flex items-center gap-2"><i data-lucide="layout-list" class="w-4 h-4"></i> 排名列表</span>
                    </span>
                    <span id="nav-trend" onclick="switchView('trend')" class="nav-tab">
                        <span class="flex items-center gap-2"><i data-lucide="trending-up" class="w-4 h-4"></i> 月度趋势</span>
                    </span>
                </div>
                <div class="hidden sm:flex items-center gap-2 text-slate-400 text-[11px] font-bold">
                    <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                    <span id="last-update-time">SYNCED LIVE</span>
                </div>
            </div>
            <div id="content-area" class="overflow-x-auto min-h-[400px]"></div>
        </div>
        
        <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 bg-slate-900/90 text-white px-8 py-3.5 rounded-2xl shadow-2xl opacity-0 transition-all duration-500 pointer-events-none text-xs font-black z-[500]">Success</div>
    </div>

    <script>
        const FIXED_MEMBERS = ["谢本权", "李洁妮", "傅思芝", "陈鸿钦", "温秋雨", "邹颖威"];
        const MONTHS = ["1月", "2月", "3月", "4月", "5月", "6月", "7月", "8月", "9月", "10月", "11月", "12月"];
        
        const TAB_CONFIGS = {
            'A1': { header: '次数', btn: '次数', name: 'A1 榜单', color: 'bg-blue-600', hex: '#2563eb', grad: 'from-blue-600 to-indigo-700' },
            'NP': { header: '意向数', btn: '意向', name: '伊赫莱NP榜单', color: 'bg-purple-600', hex: '#9333ea', grad: 'from-purple-600 to-fuchsia-700' },
            'HST': { header: '意向数', btn: '意向', name: '赫双妥榜单', color: 'bg-amber-500', hex: '#f59e0b', grad: 'from-amber-500 to-orange-600' },
            'ZYF': { header: '次数', btn: '次数', name: '早夜访榜单', color: 'bg-emerald-600', hex: '#059669', grad: 'from-emerald-500 to-teal-700' }
        };

        let state = {
            currentTab: 'A1',
            currentMonth: new Date().getMonth(),
            view: 'rank',
            data: {},
            targets: {}
        };

        function closeNotice() {
            document.getElementById('noticeModal').classList.add('hidden');
        }

        function renderStars(count) {
            if (count <= 0) return '';
            if (count > 7) {
                return `
                    <div class="flex items-center gap-1.5 star-animate">
                        <i data-lucide="star" class="w-4 h-4 text-amber-400 fill-amber-400"></i>
                        <span class="text-[11px] font-black text-amber-500 whitespace-nowrap">x ${count} 达成卓越</span>
                    </div>
                `;
            }
            let stars = '';
            for (let i = 0; i < count; i++) {
                stars += `<i data-lucide="star" class="w-3.5 h-3.5 text-amber-400 fill-amber-400 star-animate"></i>`;
            }
            return `<div class="flex items-center gap-0.5 flex-wrap max-w-[120px]">${stars}</div>`;
        }

        function getStorageKey(m = state.currentMonth, t = state.currentTab) { return `m-${m}-t-${t}`; }
        function getDataByKey(key) {
            if (!state.data[key]) { state.data[key] = FIXED_MEMBERS.map(name => ({ name, count: 0 })); }
            return state.data[key];
        }

        function calculateRanks(data) {
            const sorted = [...data].sort((a, b) => b.count - a.count);
            let currentRank = 1;
            return sorted.map((item, index) => {
                if (index > 0 && item.count < sorted[index - 1].count) currentRank = index + 1;
                return { ...item, rank: currentRank };
            });
        }

        function switchView(view) {
            state.view = view;
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            document.getElementById(`nav-${view}`).classList.add('active');
            render();
        }

        function render() {
            const container = document.getElementById('content-area');
            const config = TAB_CONFIGS[state.currentTab];
            document.documentElement.style.setProperty('--theme-color-hex', config.hex);
            document.getElementById('bigTabName').innerText = config.name;
            document.getElementById('tabIndicator').className = `w-3 h-12 rounded-full shadow-lg ${config.color}`;
            document.getElementById('currentMonthLabel').innerText = `${MONTHS[state.currentMonth]}数据汇总`;
            
            if (state.view === 'rank') renderRankView(container, config);
            else renderTrendView(container, config);
            
            if (window.lucide) lucide.createIcons();
            save();
        }

        function renderRankView(container, config) {
            const items = calculateRanks(getDataByKey(getStorageKey()));
            container.innerHTML = `
                <table class="rank-table w-full text-left border-collapse">
                    <thead>
                        <tr class="text-slate-400 text-[11px] border-b border-slate-50 bg-slate-50/50 uppercase tracking-wider">
                            <th class="col-rank px-10 py-5 font-black whitespace-nowrap">排名</th>
                            <th class="col-name px-4 py-5 font-black whitespace-nowrap">成员</th>
                            <th class="col-total px-4 py-5 font-black whitespace-nowrap">${config.header}</th>
                            <th class="col-target px-4 py-5 font-black whitespace-nowrap">目标</th>
                            <th class="col-progress px-4 py-5 font-black whitespace-nowrap">进度</th>
                            <th class="col-action px-10 py-5 font-black text-right whitespace-nowrap">操作</th>
                        </tr>
                    </thead>
                    <tbody class="text-sm">
                        ${items.map(item => {
                            const badgeClass = item.rank <= 3 ? `badge-${item.rank}` : 'bg-slate-100 text-slate-400';
                            let trophyHtml = '';
                            if (item.rank === 1) trophyHtml = '<i data-lucide="trophy" class="w-4 h-4 trophy-gold trophy-float shrink-0"></i>';
                            else if (item.rank === 2) trophyHtml = '<i data-lucide="trophy" class="w-4 h-4 trophy-silver trophy-float shrink-0"></i>';
                            else if (item.rank === 3) trophyHtml = '<i data-lucide="trophy" class="w-4 h-4 trophy-bronze trophy-float shrink-0"></i>';

                            const targetKey = `${state.currentTab}-${state.currentMonth}-${item.name}`;
                            const targetVal = state.targets[targetKey] || 0;
                            const percent = targetVal > 0 ? (item.count / targetVal * 100).toFixed(1) : 0;
                            const isCompleted = parseFloat(percent) >= 100;

                            return `
                                <tr class="border-b border-slate-50 transition-colors">
                                    <td class="col-rank px-10 py-6">
                                        <div class="w-8 h-8 rounded-lg ${badgeClass} flex items-center justify-center font-black text-xs shadow-sm">${item.rank}</div>
                                    </td>
                                    <td class="col-name px-4 py-6">
                                        <div class="flex items-center gap-3 overflow-hidden">
                                            <div class="w-9 h-9 shrink-0 rounded-full bg-gradient-to-br ${config.grad} flex items-center justify-center text-[10px] text-white font-black border-2 border-white shadow-sm">${item.name.slice(0,1)}</div>
                                            <div class="flex items-center gap-2 truncate pr-2">
                                                <span class="font-bold text-slate-700 truncate">${item.name}</span>
                                                <span class="flex items-center justify-center w-5 h-5">
                                                    ${trophyHtml}
                                                </span>
                                            </div>
                                        </div>
                                    </td>
                                    <td class="col-total px-4 py-6">
                                        <div class="flex flex-col gap-1.5">
                                            <span class="font-black text-2xl text-slate-900 tabular-nums leading-none">${item.count}</span>
                                            ${renderStars(item.count)}
                                        </div>
                                    </td>
                                    <td class="col-target px-4 py-6">
                                        <input type="number" value="${targetVal}" onchange="updateTarget('${item.name}', this.value)"
                                            class="w-16 bg-slate-50 border border-slate-200 rounded-lg py-1 px-2 text-xs font-bold text-slate-500 focus:bg-white focus:ring-2 focus:ring-blue-400 outline-none transition-all text-center">
                                    </td>
                                    <td class="col-progress px-4 py-6">
                                        <div class="flex flex-col gap-1.5 pr-4">
                                            <span class="font-black text-[12px] ${isCompleted ? 'text-green-600' : 'text-slate-400'}">${percent}%</span>
                                            <div class="w-full h-1.5 bg-slate-100 rounded-full overflow-hidden">
                                                <div class="h-full ${isCompleted ? 'bg-green-500' : config.color} transition-all duration-500" style="width: ${Math.min(percent, 100)}%"></div>
                                            </div>
                                        </div>
                                    </td>
                                    <td class="col-action px-10 py-6">
                                        <div class="flex justify-end items-center gap-2">
                                            <button onclick="increment('${item.name}')" class="px-3 py-2 ${config.color} text-white rounded-xl text-[10px] font-black hover:scale-105 transition-all active:scale-95 flex items-center gap-1">
                                                <i data-lucide="plus" class="w-3 h-3"></i> ${config.btn}
                                            </button>
                                            <button onclick="askDecrement('${item.name}')" class="p-2 text-slate-300 hover:text-red-400 transition-colors">
                                                <i data-lucide="minus-circle" class="w-4 h-4"></i>
                                            </button>
                                        </div>
                                    </td>
                                </tr>
                            `;
                        }).join('')}
                    </tbody>
                </table>
            `;
        }

        function renderTrendView(container, config) {
            const currentRanks = calculateRanks(getDataByKey(getStorageKey()));
            let prevMonthIndex = state.currentMonth - 1; 
            if (prevMonthIndex < 0) prevMonthIndex = 11;
            const prevMonthData = getDataByKey(getStorageKey(prevMonthIndex, state.currentTab));
            const prevRanks = calculateRanks(prevMonthData);

            container.innerHTML = `
                <table class="rank-table w-full text-left border-collapse">
                    <thead>
                        <tr class="text-slate-400 text-[11px] border-b border-slate-50 bg-slate-50/50 uppercase font-black tracking-wider">
                            <th class="px-10 py-5">成员</th>
                            <th class="px-4 py-5 text-center">当前排名</th>
                            <th class="px-4 py-5 text-center">当月数值</th>
                            <th class="px-4 py-5 text-center">上月排名</th>
                            <th class="px-10 py-5 text-right">趋势</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${currentRanks.map(item => {
                            const prevItem = prevRanks.find(p => p.name === item.name);
                            let changeHtml = '<span class="text-slate-300">—</span>';
                            if (prevItem) {
                                const rankDiff = prevItem.rank - item.rank;
                                if (rankDiff > 0) changeHtml = `<div class="flex items-center justify-end gap-1 text-green-500 font-black text-xs"><i data-lucide="arrow-up" class="w-4 h-4"></i>提升 ${rankDiff}</div>`;
                                else if (rankDiff < 0) changeHtml = `<div class="flex items-center justify-end gap-1 text-red-400 font-black text-xs"><i data-lucide="arrow-down" class="w-4 h-4"></i>下降 ${Math.abs(rankDiff)}</div>`;
                                else changeHtml = `<span class="text-slate-400 font-bold">持平</span>`;
                            }
                            return `
                                <tr class="border-b border-slate-50">
                                    <td class="px-10 py-8 font-bold text-slate-700">${item.name}</td>
                                    <td class="px-4 py-8 text-center"><span class="font-black text-xl italic text-slate-900">#${item.rank}</span></td>
                                    <td class="px-4 py-8 text-center font-black tabular-nums">${item.count}</td>
                                    <td class="px-4 py-8 text-center text-slate-400 font-bold">#${prevItem ? prevItem.rank : '--'}</td>
                                    <td class="px-10 py-8 text-right">${changeHtml}</td>
                                </tr>
                            `;
                        }).join('')}
                    </tbody>
                </table>
            `;
        }

        function updateTarget(name, val) {
            const targetKey = `${state.currentTab}-${state.currentMonth}-${name}`;
            state.targets[targetKey] = Math.max(0, parseInt(val) || 0);
            save(); render();
        }

        function increment(name) {
            const m = getDataByKey(getStorageKey()).find(x => x.name === name);
            if (m) { m.count++; render(); showToast(`${name} 数值+1`); }
        }

        let pendingMember = null;
        function askDecrement(name) {
            const m = getDataByKey(getStorageKey()).find(x => x.name === name);
            if (!m || m.count <= 0) return;
            pendingMember = name;
            // 改进后的内容填充
            document.getElementById('confirmText').innerHTML = `
                <p class="text-slate-500 font-medium text-xs mb-1">即将扣减成员统计：</p>
                <p class="text-2xl font-black text-red-600">${name}</p>
            `;
            document.getElementById('confirmModal').classList.remove('hidden');
            document.getElementById('confirmActionBtn').onclick = () => {
                const target = getDataByKey(getStorageKey()).find(x => x.name === pendingMember);
                if (target) { target.count--; render(); showToast(`已成功扣减 ${pendingMember}`); }
                closeConfirm();
            };
        }

        function closeConfirm() { document.getElementById('confirmModal').classList.add('hidden'); }
        function save() { localStorage.setItem('rankings_v11', JSON.stringify({ data: state.data, targets: state.targets })); }
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg; t.style.opacity = '1';
            setTimeout(() => t.style.opacity = '0', 2000);
        }

        function selectTab(t) { state.currentTab = t; render(); }
        function updateMonth() { state.currentMonth = parseInt(document.getElementById('monthSelect').value); render(); }

        // --- 核心更新逻辑：带奖牌图标的复制功能 ---
        function copyToClipboard() {
            const items = calculateRanks(getDataByKey(getStorageKey()));
            const config = TAB_CONFIGS[state.currentTab];
            const medals = { 1: '🏆', 2: '🥈', 3: '🥉' };
            
            let text = `🌟 【${config.name}】${MONTHS[state.currentMonth]} 实时榜单排名\n`;
            text += `--------------------------------\n`;
            
            items.forEach(i => {
                const medal = medals[i.rank] || '';
                // 拼接：#1🏆. 谢本权：累计次数 7
                text += `#${i.rank}${medal}. ${i.name}：累计${config.header} ${i.count}\n`;
            });
            
            text += `--------------------------------\n`;
            text += `生成时间：${new Date().toLocaleString('zh-CN', { hour12: false })}`;

            const el = document.createElement('textarea'); 
            el.value = text; 
            document.body.appendChild(el); 
            el.select();
            document.execCommand('copy'); 
            document.body.removeChild(el);
            showToast('已复制带奖牌的榜单内容');
        }

        function exportAllToExcel() {
            const allData = [];
            ['A1', 'NP', 'HST', 'ZYF'].forEach(tabId => {
                const config = TAB_CONFIGS[tabId];
                const items = calculateRanks(getDataByKey(getStorageKey(state.currentMonth, tabId)));
                allData.push([config.name]);
                allData.push(['排名', '成员', config.header, '目标', '进度']);
                items.forEach(item => {
                    const targetKey = `${tabId}-${state.currentMonth}-${item.name}`;
                    const targetVal = state.targets[targetKey] || 0;
                    const percent = targetVal > 0 ? (item.count / targetVal * 100).toFixed(1) + '%' : '0%';
                    allData.push([item.rank, item.name, item.count, targetVal, percent]);
                });
                allData.push([]);
            });
            const wb = XLSX.utils.book_new();
            const ws = XLSX.utils.aoa_to_sheet(allData);
            const merges = [];
            let currentRow = 0;
            ['A1', 'NP', 'HST', 'ZYF'].forEach(tabId => {
                merges.push({ s: { r: currentRow, c: 0 }, e: { r: currentRow, c: 4 } });
                const items = getDataByKey(getStorageKey(state.currentMonth, tabId));
                currentRow += (items.length + 3);
            });
            ws['!merges'] = merges;
            XLSX.utils.book_append_sheet(wb, ws, "汇总榜单");
            XLSX.writeFile(wb, `全榜单汇总_${MONTHS[state.currentMonth]}.xlsx`);
        }

        window.onload = () => {
            const ms = document.getElementById('monthSelect');
            const stored = localStorage.getItem('rankings_v11');
            if (stored) {
                const parsed = JSON.parse(stored);
                state.data = parsed.data || {};
                state.targets = parsed.targets || {};
            }
            MONTHS.forEach((m, i) => {
                const opt = document.createElement('option');
                opt.value = i; opt.text = m;
                if (i === state.currentMonth) opt.selected = true;
                ms.add(opt);
            });
            render();
        };
    </script>
</body>
</html>
